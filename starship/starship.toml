"$schema" = 'https://starship.rs/config-schema.json'

# Espacio entre comandos para que respire visualmente
add_newline = true
command_timeout = 1000

# ─── Prompt character ──────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

# ─── Directory ─────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
read_only = " 󰌾"

# ─── Git ───────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "\\$${count}"

# ─── Languages ─────────────────────────────────────────────
[nodejs]
symbol = " "
style = "bold green"

[golang]
symbol = " "
style = "bold cyan"

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"

[docker_context]
symbol = " "
style = "bold blue"

# ─── Command duration (muestra tiempo si tarda > 2s) ──────
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

# ─── macOS battery (opcional — ocultable si molesta) ─────
[battery]
disabled = true
